embodiment: xingchen
# Whole-chunk replay retains VLA reference; human commands remain the BC target.
# See docs/halowa_soma.md. Explicit opt-in; existing MLP configs are unchanged.
# Set SOMA_VAE_CHANNELS to the actual video_condition channel count (not 512).
device: cuda
reference_seed: 2026
learner_type: halo_wa
actor_checkpoint: null
replay_checkpoint: null
# Online requires a qualified collection checkpoint; full resume includes demos.
demo_checkpoint: null
save_interval: 100
save_dir: checkpoints/xingchen_soma_halo_wa

action_codec:
  # Physical EEF25: xyz metres, xyzw, head radians, grippers 0..100.
  action_low: ${oc.env:XINGCHEN_ACTION_LOW}
  action_high: ${oc.env:XINGCHEN_ACTION_HIGH}

actor_model:
  model_type: halo_wa_policy
  precision: fp32
  policy_setup: xingchen-absolute-eef
  visual_dim: ${oc.env:SOMA_VAE_CHANNELS}
  hidden_dim: 512
  num_heads: 8
  max_visual_tokens: 4096
  proprio_dim: 25
  action_dim: 25
  num_action_chunks: 12

learner:
  training_stage: collect
  min_buffer_size: 1
  batch_size: 64
  replay_capacity: 50000
  bc_warmup_steps: 1000
  bc_coef: 50.0
  demo_ratio: 0.5
  utd: 5
  actor_update_interval: 2
  actor_lr: 2.5e-5
  critic_lr: 3.0e-5
  gamma: 0.99  # Task-dependent; gamma**12 bootstraps each complete chunk.
  tau: 0.005
  target_action_noise: false
  actor_update_action_noise: false
  reference_dropout_prob: 0.0
  q_upper_bound: 1.0
  enable_q_upper_bound: true
  overshoot_penalty_coef: 1.0
