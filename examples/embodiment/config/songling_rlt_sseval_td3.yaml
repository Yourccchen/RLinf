# In-process Runtime config loaded by RWI policy/policies/rlinf/policy.py.
# This file is resolved only on the GPU Policy host.

device: ${oc.env:SONGLING_RLT_DEVICE,cuda}
reference_seed: 2026
actor_checkpoint: ${oc.env:SONGLING_RLT_ACTOR_CHECKPOINT,''}

action_codec:
  action_low: ${oc.env:SONGLING_ACTION_LOW}
  action_high: ${oc.env:SONGLING_ACTION_HIGH}

feature_model:
  model_type: openpi_rlinf
  model_path: ${oc.env:SONGLING_RLT_STAGE1_CHECKPOINT}
  precision: bf16
  num_action_chunks: 10
  action_dim: 14
  num_steps: 5
  add_value_head: false
  is_lora: false
  openpi_data:
    repo_id: songling/all_tasks
    default_prompt: fold clothes
  openpi:
    task: eval
    config_name: pi05_rlt_songling_all
    num_images_in_input: 3
    action_chunk: 10
    action_horizon: 10
    action_env_dim: 14
    num_steps: 5
    model_action_dim: 32
    paligemma_variant: gemma_2b
    action_expert_variant: gemma_300m
    max_token_len: 200
    discrete_state_input: true
    train_expert_only: false
    add_value_head: false
    detach_critic_input: true
    use_rlt: true
    rlt_alpha: 1.0
    rlt_input_dim: 2048
    rlt_embed_dim: 2048
    rlt_prefix_seq_len: 1024
    rlt_num_layers: 2
    rlt_num_heads: 8
    rlt_mlp_ratio: 4.0
    rlt_encoder_type: append_self_attention
    rlt_image_only: false
    rlt_use_mask: true

actor_model:
  model_type: rlt_td3_mlp_policy
  precision: fp32
  policy_setup: songling-absolute-qpos
  z_dim: 2048
  proprio_dim: 14
  action_dim: 14
  num_action_chunks: 10
  ref_num_action_chunks: 10
  add_value_head: false
  add_q_head: true
  q_head_type: default
  mlp_hidden_dim: 256
  mlp_num_hidden_layers: 2
  actor_noise_sigma: 0.1
  ref_action_dropout: 0.5
  is_lora: false

learner:
  batch_size: 256
  min_buffer_size: 1000
  replay_capacity: 50000
  utd: 5
  gamma: 0.99
  tau: 0.005
  actor_update_interval: 2
  actor_lr: 1.0e-4
  critic_lr: 1.0e-4
  actor_clip_grad: 10.0
  critic_clip_grad: 10.0
  reference_dropout_prob: 0.5
  target_action_noise: true
  actor_update_action_noise: true
  warmup_updates: 5000
  warmup_bc_weight: 7.0
  warmup_q_weight: 0.05
  online_bc_weight: 2.8
  online_q_weight: 0.5
  ramp_updates: 20000
  queue_size: 1024
  seed: 1234
