# In-process Runtime config loaded by RWI policy/policies/rlinf/policy.py.
# This file is resolved only on the GPU Policy host.
#
# Frozen Stage1 VLA/RLT shape and OpenPI transforms are copied from
# actor.model in stage1_sft_config. This file keeps the checkpoint path,
# eval precision, norm stats path, paper-style Gaussian actor, and learner. openpi.task is
# forced to eval. Eval hosts do not share the Stage1 SFT assets path, so
# feature_model.openpi_data.norm_stats_path is set here rather than copied
# from training.
# Stage1 keeps H=50 and sends the full VLA candidate. Before the critical
# switch the Slave may execute a longer VLA prefix K; after the switch Stage2
# reads/stores the first C actions, predicts C actions, and executes C steps.

stage1_sft_config: examples/sft/config/songling_bfjm_rlt_stage1_sft_openpi_pi05.yaml

device: ${oc.env:SONGLING_RLT_DEVICE,cuda}
reference_seed: 2026
# Online collection samples the Gaussian Actor; set false for deterministic eval.
actor_rollout_sampling: true
transition_stride: 2
# Paper-faithful runs start Actor/Critic and replay from scratch. A step_N
# directory resumes a checkpoint created by this same model_type.
actor_checkpoint: null
replay_checkpoint: /home/fanyiming/RLinf/results/songling_rlt_sseval_td3_keychunk_c10/checkpoints/20260923_190659/step_504
# Every N TD3 critic updates. 0 disables auto-save. Each save copies the whole
# replay, so a small value multiplies disk use. 50 is about 10 new C=10
# transitions at UTD 5.
save_interval: 50
# Relative paths resolve against the RLinf repo root, not the RWI cwd.
# Each Policy start writes save_dir/<YYYYMMDD_HHMMSS>/step_N and does not
# overwrite an older run's step_N, including replay_checkpoint. The execute
# horizon is embedded automatically, e.g. c10 or c50.
save_dir: results/songling_rlt_sseval_paper_c${actor_model.num_action_chunks}/checkpoints

action_codec:
  action_low: [-2.617994, 0.0, -2.967060, -1.745330, -1.221730, -2.094396, 0.0, -2.617994, 0.0, -2.967060, -1.745330, -1.221730, -2.094396, 0.0]
  action_high: [2.617994, 3.141593, 0.0, 1.745330, 1.221730, 2.094396, 100.0, 2.617994, 3.141593, 0.0, 1.745330, 1.221730, 2.094396, 100.0]

feature_model:
  model_path: /home/fanyiming/RLinf/checkpoints/songling_bfjm_rlt_stage1_sft_openpi_pi05/global_step_40000/actor
  precision: bf16
  is_lora: false
  openpi_data:
    norm_stats_path: /home/fanyiming/RLinf/checkpoints/songling_bfjm_rlt_stage1_sft_openpi_pi05/norm_stats.json

actor_model:
  model_type: rlt_paper_mlp_policy
  precision: fp32
  policy_setup: songling-absolute-qpos
  z_dim: 2048
  proprio_dim: 14
  action_dim: 14
  num_action_chunks: 10
  add_value_head: false
  add_q_head: true
  q_head_type: default
  mlp_hidden_dim: 256
  mlp_num_hidden_layers: 2
  fixed_std: 0.002
  is_lora: false

learner:
  # One sample stores a C-step reference, action, reward, and validity sequence.
  # Stage1 generates H=50 online, but only its first C actions enter replay.
  # Sampling is with replacement and clamps to the replay size, so this may
  # exceed min_buffer_size while the buffer is still small.
  batch_size: 256
  min_buffer_size: 100
  replay_capacity: 50000
  # Held-out episodes stop improving after ~500 BC updates on this dataset, so
  # 5 updates per new chunk only bought memorization. Raise it again once the
  # replay is several times larger.
  utd: 5
  gamma: 0.99
  tau: 0.005
  actor_update_interval: 2
  actor_lr: 1.0e-4
  critic_lr: 1.0e-4
  actor_clip_grad: 10.0
  critic_clip_grad: 10.0
  reference_dropout_prob: 0.5
  # Actor loss = bc_regularizer_beta * BC - Q1.
  actor_objective: bc_regularized_q
  bc_regularizer_beta: 2.0
  # Count executed critical-phase transitions, not gradient updates.
  warmup_transitions: 100
  target_action_noise: true
  actor_update_action_noise: true
  queue_size: 1024
  seed: 1234
  # Training metrics line every N critic updates.
  log_interval: 100
