# Load through RWI RlinfPolicy with embodiment=xingchen.
# Stage1 retains its trained 31D rot6d layout; Stage2 and wire use 25D EEF.
# Set XINGCHEN_STAGE1_CONFIG/CHECKPOINT/NORM_STATS and action bounds first.
stage1_sft_config: ${oc.env:XINGCHEN_STAGE1_CONFIG}

device: ${oc.env:XINGCHEN_RLT_DEVICE,cuda}
reference_seed: 2026
# Online collection samples the Gaussian Actor; set false for deterministic eval.
actor_rollout_sampling: false
transition_stride: 2
# Paper-faithful runs start Actor/Critic and replay from scratch. A step_N
# directory resumes a checkpoint created by this same model_type.
actor_checkpoint: null
replay_checkpoint: null
# Every N TD3 critic updates. 0 disables auto-save. Each save copies the whole
# replay, so a small value multiplies disk use. 50 is about 10 new C=10
# transitions at UTD 5.
save_interval: 50
# Relative paths resolve against the RLinf repo root, not the RWI cwd.
# Each Policy start writes save_dir/<YYYYMMDD_HHMMSS>/step_N and does not
# overwrite an older run's step_N, including replay_checkpoint. The execute
# horizon is embedded automatically, e.g. c10 or c50.
save_dir: results/xingchen_rlt_sseval_c${actor_model.num_action_chunks}/checkpoints

action_codec:
  # JSON arrays of 25 physical bounds, calibrated for the deployed robot/task.
  action_low: ${oc.env:XINGCHEN_ACTION_LOW}
  action_high: ${oc.env:XINGCHEN_ACTION_HIGH}

feature_model:
  model_path: ${oc.env:XINGCHEN_STAGE1_CHECKPOINT}
  precision: bf16
  is_lora: false
  openpi_data:
    norm_stats_path: ${oc.env:XINGCHEN_NORM_STATS}

actor_model:
  model_type: rlt_paper_mlp_policy
  precision: fp32
  policy_setup: xingchen-absolute-eef
  z_dim: 2048
  proprio_dim: 25
  action_dim: 25
  num_action_chunks: 10
  add_value_head: false
  add_q_head: true
  q_head_type: default
  mlp_hidden_dim: 256
  mlp_num_hidden_layers: 2
  # Give z_rl, proprio, reference, and candidate-action branches equal-width
  # normalized representations before fusion.
  projection_dim: 128
  fixed_std: 0.002
  # Predict a Gaussian correction around the VLA reference instead of a full chunk.
  actor_residual: true
  is_lora: false

learner:
  # One sample stores a C-step reference, action, reward, and validity sequence.
  # Stage1 generates H=50 online, but only its first C actions enter replay.
  # Sampling is with replacement and clamps to the replay size, so this may
  # exceed min_buffer_size while the buffer is still small.
  batch_size: 256
  min_buffer_size: 50
  replay_capacity: 50000
  # Held-out episodes stop improving after ~500 BC updates on this dataset, so
  # 5 updates per new chunk only bought memorization. Raise it again once the
  # replay is several times larger.
  utd: 5
  gamma: 0.99
  tau: 0.005
  actor_update_interval: 2
  actor_lr: 1.0e-4
  critic_lr: 1.0e-4
  actor_clip_grad: 10.0
  critic_clip_grad: 10.0
  reference_dropout_prob: 0.5
  # Actor loss = bc_regularizer_beta * BC - Q1 + residual smoothness.
  actor_objective: bc_regularized_q
  bc_regularizer_beta: 50
  # Penalize high-frequency residual corrections while preserving the VLA profile.
  residual_velocity_weight: 50
  residual_acceleration_weight: 20
  # Count executed critical-phase transitions, not gradient updates.
  warmup_transitions: 100
  target_action_noise: true
  actor_update_action_noise: true
  queue_size: 1024
  seed: 1234
  # Training metrics line every N critic updates.
  log_interval: 100
