# Xingchen OpenPI Stage1 is 31D rot6d; the RWI adapter exposes EEF25.
# Uses the target branch's existing TD3 actor/learner, not the source paper actor.
embodiment: xingchen
transition_stride: 2
stage1_sft_config: ${oc.env:XINGCHEN_STAGE1_CONFIG}

device: ${oc.env:XINGCHEN_RLT_DEVICE,cuda}
reference_seed: 2026
# Null keeps a random Stage2 policy. A step_N directory restores learner.pt
# and replay/. Mutually exclusive with replay_checkpoint.
actor_checkpoint: null
# Reuse labeled chunks without restoring actor/critic weights. A step_N
# directory loads replay/ only, then runs (n - min_buffer_size + 1) * utd
# critic updates and writes save_interval checkpoints under this run's
# timestamp folder. Null skips restore.
replay_checkpoint: null
# replay_checkpoint: null
# Every N TD3 critic updates. 0 disables auto-save. Each save copies the whole
# replay, so a small value multiplies disk use. 50 is about 25 new C=10
# transitions at UTD 2.
save_interval: 50
# Relative paths resolve against the RLinf repo root, not the RWI cwd.
# Each Policy start writes save_dir/<YYYYMMDD_HHMMSS>/step_N and does not
# overwrite an older run's step_N, including replay_checkpoint. The execute
# horizon is embedded automatically, e.g. c10 or c50.
save_dir: results/xingchen_rlt_sseval_td3_c${actor_model.num_action_chunks}/checkpoints

action_codec:
  action_low: ${oc.env:XINGCHEN_ACTION_LOW}
  action_high: ${oc.env:XINGCHEN_ACTION_HIGH}

feature_model:
  model_path: ${oc.env:XINGCHEN_STAGE1_CHECKPOINT}
  precision: bf16
  is_lora: false
  openpi_data:
    norm_stats_path: ${oc.env:XINGCHEN_NORM_STATS}

actor_model:
  model_type: rlt_td3_mlp_policy
  precision: fp32
  policy_setup: xingchen-absolute-eef
  z_dim: 2048
  proprio_dim: 25
  action_dim: 25
  num_action_chunks: 10
  add_value_head: false
  add_q_head: true
  q_head_type: default
  mlp_hidden_dim: 256
  mlp_num_hidden_layers: 2
  # Residual actor: execute clamp(VLA_ref + mlp). Last layer starts at 0 so
  # an untrained policy copies the VLA chunk. Do not load a previous
  # direct-reconstruction learner.pt; replay_checkpoint is still valid.
  actor_residual: true
  actor_noise_sigma: 0.1
  ref_action_dropout: 0.5
  is_lora: false

learner:
  # One sample stores a C-step reference, action, reward, and validity sequence.
  # Stage1 generates H=50 online, but only its first C actions enter replay.
  # Sampling is with replacement and clamps to the replay size, so this may
  # exceed min_buffer_size while the buffer is still small.
  batch_size: 64
  min_buffer_size: 10
  replay_capacity: 50000
  # Held-out episodes stop improving after ~500 BC updates on this dataset, so
  # 5 updates per new chunk only bought memorization. Raise it again once the
  # replay is several times larger.
  utd: 2
  gamma: 0.99
  tau: 0.005
  actor_update_interval: 2
  actor_lr: 1.0e-4
  critic_lr: 1.0e-4
  actor_clip_grad: 10.0
  critic_clip_grad: 10.0
  reference_dropout_prob: 0.5
  target_action_noise: true
  actor_update_action_noise: true
  # Penalize high-frequency residual corrections while preserving the VLA profile.
  residual_velocity_weight: 50
  residual_acceleration_weight: 20
  warmup_updates: 50
  warmup_bc_weight: 5.0
  warmup_q_weight: 0.05
  online_bc_weight: 2.8
  online_q_weight: 0.45
  ramp_updates: 20
  queue_size: 1024
  seed: 1234
  # Training metrics line every N critic updates. residual_abs_mean near 0
  # means the actor is still copying the VLA chunk.
  log_interval: 100
