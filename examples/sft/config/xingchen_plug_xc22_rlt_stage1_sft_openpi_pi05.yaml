# Xingchen plug insertion: pi0.5 base weights with joint RLT + VLA training.
# Compute task-specific statistics before training (AWS credentials required):
#   .venv/bin/python -m toolkits.calculate_ario_norm_stats \
#     --config-name xingchen_plug_xc22_rlt_stage1_sft_openpi_pi05
# Compose without launching workers:
#   EMBODIED_PATH=$PWD/examples/sft .venv/bin/python -m examples.sft.train_vla_sft \
#     --config-name xingchen_plug_xc22_rlt_stage1_sft_openpi_pi05 --cfg job
# Launch on B200 with examples/sft/run_xingchen_rlt_stage1.sh.
# Each actor checkpoint bundles norm_stats.json plus the OpenPI asset copy.
defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "/mnt/vepfs/world/fanyiming/rlinf_runs"
    project_name: rlinf-rlt
    experiment_name: "xingchen_plug_xc22_rlt_stage1_sft_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 60000
  val_check_interval: -1
  save_interval: 2500

data:
  # ARIO episodes are streamed directly from OSS without LeRobot conversion.
  train_data_paths:
    - dataset_path: "s3://shengshu-world-model-data/ARIO-new/xingchen/Test_插插头_01_XC22_261012_05/"
      weight: 1.0
  s3_prefixes: "s3://shengshu-world-model-data/ARIO-new/xingchen/Test_插插头_01_XC22_261012_05/"
  s3_endpoint: "https://oss-cn-wulanchabu-internal.aliyuncs.com"
  # Unified state.pt: semantic endpose_torso, qpos_head, endpose_left,
  # gripper_left, endpose_right, gripper_right. Retain source axes and units,
  # including raw gripper values; do not use canonical55 pose conversions.
  data_format: "xingchen_state"
  # Absolute targets: frames t+1 through t+50; repeat the final frame at the end.
  action_start_offset: 1
  filter_episodes_by_state: True
  # Exclude complete episodes with confirmed anomalous right-gripper values.
  excluded_episodes:
    - "s3://shengshu-world-model-data/ARIO-new/xingchen/Test_插插头_01_XC22_261012_05/episode_82/"
    - "s3://shengshu-world-model-data/ARIO-new/xingchen/Test_插插头_01_XC22_261012_05/episode_90/"
    - "s3://shengshu-world-model-data/ARIO-new/xingchen/Test_插插头_01_XC22_261012_05/episode_101/"
    - "s3://shengshu-world-model-data/ARIO-new/xingchen/Test_插插头_01_XC22_261012_05/episode_136/"
  load_instructions: True
  # Use the task owner's selected coarse Chinese annotation field.
  instruction_field: "instruction_qwen38_max_coarse_ch"
  video_downsample_rate: 1
  min_frames: 51
  num_workers: 8
  cache_size: 32
  # Keep this at 0: cached decord readers retain decoded frame buffers.
  video_reader_cache_size: 0
  disk_cache_dir: "/mnt/vepfs/world/fanyiming/cache/ario_xingchen_plug_xc22"
  disk_cache_max_gb: 200.0
  # Uncomment for a data and configuration smoke test.
  # max_episodes: 4

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 64
  seed: 0

  model:
    precision: fp32
    model_path: "/mnt/vepfs/world/fanyiming/models/pi05_base_RLinf"
    model_type: "openpi_rlinf"
    num_action_chunks: 50
    # torso[0:9], head[9:11], left EEF[11:20], left gripper[20],
    # right EEF[21:30], right gripper[30]. EEF poses retain source units.
    action_dim: 31
    add_value_head: False
    num_steps: 5
    openpi:
      task: sft
      config_name: "pi05_rlt_xingchen_joint"
      num_images_in_input: 3
      train_expert_only: False
      detach_critic_input: True
      action_horizon: 50
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      model_action_dim: 32
      # Match Songling: all 32 dimensions participate in VLA loss, including
      # the zero-padded final dimension. The action output remains 31-D.
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: True
      # Joint objective: rlt_loss + rlt_alpha * vla_loss.
      use_rlt: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_encoder_type: "append_self_attention"
      rlt_image_only: False
      rlt_use_mask: True  # RLT token mask; does not mask action dimensions.

    openpi_data:
      repo_id: "xingchen/plug_xc22_261012_05"
      # Per-episode instructions take priority over this task-level prompt.
      default_prompt: "插插头"
      # Generated from this task by toolkits/calculate_ario_norm_stats.py.
      # Both state and actions need 31-D mean/std/q01/q99, computed with the
      # same absolute-action, frame-offset, and sampling settings as this run.
      # All 31 dimensions use the same quantile rule as Songling.
      # Pi0.5 uses q01/q99: 2 * (x - q01) / (q99 - q01 + 1e-6) - 1.
      # Normalize before padding to 32-D; never reuse Songling's 14-D stats.
      norm_stats_path: "/mnt/vepfs/world/fanyiming/models/pi05_base_RLinf/xingchen/plug_xc22_261012_05_q01_q99_filtered/norm_stats.json"

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 60000
    lr_warmup_steps: 5000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
