defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    # Absolute path: the job's cwd differs from the devbox, and this lands on
    # shared storage so results survive the pod.
    log_path: "/mnt/vepfs/world/caimengchen/rlinf_runs"
    project_name: rlinf-rlt
    experiment_name: "songling_rlt_stage1_sft_openpi_pi05"
    logger_backends: ["wandb", "tensorboard"]

  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 2500

data:
  # validate_sft_cfg requires train_data_paths; the Xingchen/Songling loader
  # accepts an s3:// URI here and uses it as the episode prefix.
  train_data_paths:
    - dataset_path: "s3://shengshu-world-model-data/ARIO-new/songling/叠黑色T恤/"
      weight: 1.0
  # Explicit prefix (takes priority over train_data_paths in the loader).
  s3_prefixes: "s3://shengshu-world-model-data/ARIO-new/songling/叠黑色T恤/"
  s3_endpoint: "https://oss-cn-wulanchabu-internal.aliyuncs.com"
  # Songling dual-arm: the 14-D [qpos_left 6, gripper_left 1, qpos_right 6,
  # gripper_right 1] vector is sliced out of state.pt's __canonical55__.
  data_format: "songling_canonical55"
  action_start_offset: 1
  filter_episodes_by_state: True
  # Per-episode language from instructions.json rather than a fixed prompt.
  load_instructions: True
  instruction_field: "sub_instructions"
  # 30fps native; no temporal downsampling (matches the openpi_Ario runs).
  video_downsample_rate: 1
  min_frames: 51
  # Host RAM, not GPU memory, is the binding constraint here: every rank forks
  # num_workers persistent loader processes, so the per-worker footprint is
  # multiplied by 8 ranks. 4 keeps decode off the critical path (~24 frame reads
  # per step at 0.15s each, spread over 4 workers, against a 7.3s step).
  num_workers: 4
  cache_size: 32
  # Must stay 0. A cached decord VideoReader accumulates decoded frame buffers
  # on every random seek and only releases them when the reader is destroyed;
  # holding 16 of them grew a single loader process past 28GB in 100 reads and
  # OOM-killed the node. Shuffling over frames also makes the cache pointless --
  # consecutive samples land in unrelated episodes, so it almost never hits.
  video_reader_cache_size: 0
  # Decoded-episode cache on shared storage (pod /tmp is too small for this).
  disk_cache_dir: "/mnt/vepfs/world/caimengchen/cache/ario_songling_single"
  disk_cache_max_gb: 200.0
  # Uncomment to smoke-test the pipeline on a handful of episodes first:
  # max_episodes: 4

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Full node = 8 GPUs. grad_accum = global / micro / world_size = 8.
  micro_batch_size: 1
  global_batch_size: 64
  seed: 0

  model:
    precision: fp32
    model_path: "/mnt/vepfs/world/caimengchen/models/pi05_base"
    model_type: "openpi_rlinf"
    num_action_chunks: 10
    # Songling dual-arm qpos + grippers.
    action_dim: 14
    add_value_head: False
    num_steps: 5
    openpi:
      task: sft
      config_name: "pi05_rlt_songling_joint"
      num_images_in_input: 3          # cam_high + left_wrist + right_wrist
      train_expert_only: False
      detach_critic_input: True
      action_horizon: 10
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: True
      # RLT token encoder-decoder trained jointly with the VLA:
      #   loss = rlt_loss + rlt_alpha * vla_loss
      use_rlt: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_encoder_type: "append_self_attention"
      rlt_image_only: False
      rlt_use_mask: True

    openpi_data:
      repo_id: "songling/garment_folding"
      default_prompt: "fold clothes"
      norm_stats_path: null

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 20000
    lr_warmup_steps: 5000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    # The embody pool gives L20D cards (48GB). pi0.5 (~3.5B params) plus Adam
    # state does not fit replicated, so shard params/grads/optimizer across the
    # 8 GPUs instead of "no_shard".
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
