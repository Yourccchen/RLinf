defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "/mnt/vepfs/world/caimengchen/rlinf_runs"
    project_name: rlinf-rlt
    experiment_name: "songling_rlt_stage1_multitask"
    logger_backends: ["wandb", "tensorboard"]

  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 2500

data:
  # validate_sft_cfg requires train_data_paths even though the loader reads
  # the prefix list below.
  train_data_paths:
    - dataset_path: "s3://shengshu-world-model-data/ARIO-new/songling/"
      weight: 1.0
  # All 547 songling tasks (~683k episodes), one prefix per line. Listed
  # per-task rather than as one root prefix so the S3 listing fans out.
  s3_prefixes_file: "/mnt/vepfs/world/caimengchen/datasets/songling_all_prefixes.txt"
  s3_endpoint: "https://oss-cn-wulanchabu-internal.aliyuncs.com"

  data_format: "songling_canonical55"
  action_start_offset: 1
  filter_episodes_by_state: True
  load_instructions: True
  instruction_field: "sub_instructions"
  video_downsample_rate: 1
  min_frames: 51
  # 16 ranks x num_workers persistent loader processes share one host's RAM.
  num_workers: 4
  cache_size: 32
  # Must stay 0; see songling_rlt_stage1_sft_openpi_pi05.yaml. A cached decord
  # VideoReader never releases its decoded frame buffers, and across 683k
  # episodes the cache cannot hit anyway.
  video_reader_cache_size: 0
  # Threads for the parallel frame-index probe; the index is then cached in
  # index_cache_dir and reused by every later run.
  index_workers: 64
  # The data lake already knows which episodes are usable, so skip the S3
  # listing that re-confirms all three camera views: over 547 tasks it walks
  # ~9.5M objects. A missing view then surfaces as a per-episode fetch error.
  discover_from_data_lake: True
  # Objects cache on node-local disk (3.1TB free, and far faster to stat than
  # the shared CPFS, which is at 100% with 546GB left). Each node keeps its own
  # copy; nothing here needs to be shared.
  disk_cache_dir: "/var/tmp/ario_songling_all_cache"
  disk_cache_max_gb: 1200.0
  # The frame index does need sharing: probing 712k episodes costs ~30min, and
  # both nodes plus every restart should reuse one copy. Keep it out of the
  # single-task cache directory -- the index filename is keyed by data format,
  # not by episode selection, so the two corpora would land in one file.
  index_cache_dir: "/mnt/vepfs/world/caimengchen/cache/ario_songling_all"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # 2 nodes x 8 GPUs = 16 ranks. grad_accum = global / micro / 16 = 8.
  micro_batch_size: 1
  global_batch_size: 128
  seed: 0

  model:
    precision: fp32
    model_path: "/mnt/vepfs/world/caimengchen/models/pi05_base"
    model_type: "openpi_rlinf"
    num_action_chunks: 10
    action_dim: 14
    add_value_head: False
    num_steps: 5
    openpi:
      task: sft
      config_name: "pi05_rlt_songling_all"
      num_images_in_input: 3
      train_expert_only: False
      detach_critic_input: True
      action_horizon: 10
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: True
      # RLT token encoder-decoder trained jointly with the VLA:
      #   loss = rlt_loss + rlt_alpha * vla_loss
      use_rlt: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_encoder_type: "append_self_attention"
      rlt_image_only: False
      rlt_use_mask: True

    openpi_data:
      repo_id: "songling/all_tasks"
      default_prompt: ""
      norm_stats_path: null

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 20000
    lr_warmup_steps: 5000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
